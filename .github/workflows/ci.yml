name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python tests/test_engine.py -v

  compile-check:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: nvcc --version
      - run: make lib || echo "CUDA compilation requires GPU runtime — syntax check only"
      - run: nvcc -O0 -fsyntax-only -I include src/constraint_engine.cu 2>/dev/null || true
